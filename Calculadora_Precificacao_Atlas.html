<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas GR — Calculadora de Precificação</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,500;9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700;800&display=swap');
:root{
  /* -- identidade Atlas (mesma cor de marca das propostas, usada aqui com moderação) -- */
  --atlas-orange:#FF5618; --atlas-orange-2:#FF8008;
  --accent:#FF5618;
  --accent-deep:#C23F10;
  --accent-soft:#FCEBE2;
  --gold:#B3873C;
  --gold-soft:#F4E9D2;
  /* -- neutros executivos (tons quentes, não cinza puro) -- */
  --ink:#1C1A17;
  --ink-soft:#5C574C;
  --muted:#9B9587;
  --paper:#F7F4EE;
  --surface:#FFFFFF;
  --line:#E7E1D3;
  --line-soft:#EFEAE0;
  --dark:#17150F;
  --dark-2:#221F17;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Montserrat',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{text-wrap:balance;}

/* ---------- SHELL / TOP ---------- */
.wizard-shell{min-height:100vh;display:flex;flex-direction:column;}
.wizard-top{background:var(--dark);padding:26px 20px 22px;position:relative;}
.wizard-top-inner{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.back-link{font-size:11.5px;color:rgba(255,255,255,.5);text-decoration:none;font-weight:600;letter-spacing:.2px;padding-top:6px;}
.back-link:hover{color:#fff;}
.wordmark{text-align:right;}
.wordmark-name{font-family:var(--font-display);font-size:19px;font-weight:600;color:#fff;letter-spacing:.3px;}
.wordmark-name em{font-style:normal;color:var(--gold);}
.wordmark-sub{font-size:9.3px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:3px;}
.progress-track{max-width:760px;margin:22px auto 0;height:3px;background:rgba(255,255,255,.13);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:var(--gold);border-radius:10px;transition:width .45s cubic-bezier(.4,0,.2,1);}
.progress-steps{max-width:760px;margin:10px auto 0;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
.progress-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);border:none;padding:0;transition:background .25s,transform .25s;}
.progress-dot.done{background:rgba(255,255,255,.5);cursor:pointer;}
.progress-dot.current{background:var(--gold);transform:scale(1.6);}

/* ---------- STAGE / STEP PANELS ---------- */
.wizard-stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:38px 20px 150px;}
.step-panel{width:100%;max-width:760px;opacity:0;transform:translateY(14px);transition:opacity .32s ease,transform .32s ease;}
.step-panel.in{opacity:1;transform:translateY(0);}

.q-eyebrow{font-size:10.8px;font-weight:700;letter-spacing:1.6px;color:var(--accent-deep);text-transform:uppercase;margin-bottom:11px;}
.q-title{font-family:var(--font-display);font-size:29px;font-weight:600;color:var(--ink);margin:0 0 10px;line-height:1.28;}
.q-sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 30px;line-height:1.6;max-width:560px;}

.q-fields{display:flex;flex-direction:column;gap:20px;max-width:420px;}
.q-field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.2px;}
.q-field input{width:100%;border:none;border-bottom:1.6px solid var(--line-soft);padding:10px 2px;font-family:var(--font-body);font-size:16px;color:var(--ink);background:transparent;outline:none;transition:border-color .2s;}
.q-field input:focus{border-color:var(--accent-deep);}

/* ---------- PRODUCT CHIP CARDS ---------- */
.chip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px;}
.chip-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;box-shadow:0 1px 2px rgba(23,21,15,.03);}
.chip-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,21,15,.07);}
.chip-card.active{border-color:var(--accent-deep);background:var(--accent-soft);}
.chip-icon{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.chip-card.active .chip-icon{background:var(--accent-deep);color:#fff;}
.chip-icon svg{width:19px;height:19px;}
.chip-check{position:absolute;top:18px;right:18px;width:19px;height:19px;border-radius:50%;border:1.6px solid var(--line-soft);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.chip-card.active .chip-check{background:var(--accent-deep);border-color:var(--accent-deep);}
.chip-check svg{width:10px;height:10px;opacity:0;transform:scale(.4);transition:all .2s;stroke:#fff;fill:none;stroke-width:3;}
.chip-card.active .chip-check svg{opacity:1;transform:scale(1);}
.chip-name{font-size:14.5px;font-weight:700;color:var(--ink);margin:0 22px 5px 0;line-height:1.3;}
.chip-desc{font-size:11.5px;color:var(--muted);line-height:1.6;}

.link-btn{background:none;border:none;color:var(--accent-deep);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0;}
.link-btn:hover{text-decoration:underline;}

/* ---------- QUICK FILL ---------- */
.quick-fill{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-bottom:30px;padding:20px 22px;background:var(--gold-soft);border-radius:14px;}
.quick-field label{display:block;font-size:10.5px;font-weight:700;color:#8A652B;margin-bottom:7px;letter-spacing:.2px;}
.quick-field input{width:100%;border:none;border-bottom:1.6px solid rgba(138,101,43,.3);background:transparent;font-family:var(--font-display);font-size:21px;font-weight:600;color:var(--ink);padding:4px 2px;outline:none;transition:border-color .2s;}
.quick-field input:focus{border-color:var(--accent-deep);}

/* ---------- ITEM TOGGLE CARDS ---------- */
.item-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .2s,box-shadow .2s;}
.item-card.active{border-color:#EFC9A9;box-shadow:0 4px 18px rgba(194,63,16,.07);}
.item-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.item-card-info{min-width:0;}
.item-name{font-size:12.3px;font-weight:700;color:var(--ink);line-height:1.4;}
.item-meta{font-size:10.3px;color:var(--muted);margin-top:4px;}
.item-valor-input{border:none;border-bottom:1px dashed var(--line-soft);background:transparent;width:48px;text-align:right;font-family:var(--font-body);font-size:10.3px;color:var(--muted);padding:0;}
.item-valor-input:focus{outline:none;border-color:var(--accent-deep);color:var(--ink);}
.tag-recorrente{background:var(--accent-soft);color:var(--accent-deep);font-size:8.6px;font-weight:800;padding:2px 7px;border-radius:20px;margin-left:5px;letter-spacing:.2px;white-space:nowrap;}
.tag-pontual{background:var(--line-soft);color:var(--ink-soft);font-size:8.6px;font-weight:800;padding:2px 7px;border-radius:20px;margin-left:5px;letter-spacing:.2px;white-space:nowrap;}

.switch{position:relative;display:inline-block;width:36px;height:21px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch-track{position:absolute;inset:0;background:var(--line-soft);border-radius:20px;transition:background .2s;cursor:pointer;}
.switch-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .2s;}
.switch input:checked + .switch-track{background:var(--accent-deep);}
.switch input:checked + .switch-track .switch-knob{transform:translateX(15px);}

.item-card-qty{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
.item-card-qty-clip{overflow:hidden;}
.item-card.active .item-card-qty{grid-template-rows:1fr;margin-top:12px;}
.item-card-qty-inner{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:12px;}
.item-qty-input,.adic-qty-input,.adic-lump-input{border:none;border-bottom:1.6px solid var(--accent-deep);background:transparent;font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--ink);text-align:center;padding:2px;}
.item-qty-input,.adic-qty-input{width:56px;}
.adic-lump-input{width:90px;text-align:right;}
.item-qty-input:focus,.adic-qty-input:focus,.adic-lump-input:focus{outline:none;}
.item-line-total{margin-left:auto;font-family:var(--font-body);font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;color:var(--accent-deep);white-space:nowrap;}

.step-footer-subtotal{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.step-footer-subtotal b{color:var(--accent-deep);font-size:15px;font-variant-numeric:tabular-nums;}

/* ---------- BOTTOM NAV ---------- */
.wizard-nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:center;box-shadow:0 -8px 24px rgba(23,21,15,.05);z-index:50;}
.wizard-nav-inner{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
.nav-running-total{font-size:10.5px;color:var(--muted);line-height:1.4;letter-spacing:.2px;}
.nav-running-total b{display:block;font-family:var(--font-display);color:var(--ink);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
.nav-btns{display:flex;gap:10px;}
.btn{border:none;border-radius:9px;padding:12px 22px;font-family:var(--font-body);font-size:12.5px;font-weight:700;cursor:pointer;transition:filter .15s,transform .15s,background .15s;letter-spacing:.2px;white-space:nowrap;}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#000;filter:none;}
.btn-dark{background:var(--dark);color:#fff;}
.btn-ghost{background:var(--line-soft);color:var(--ink);}
.btn-ghost:hover{background:var(--line);filter:none;}
.btn[hidden]{display:none;}

/* ---------- RESULT SCREEN ---------- */
.result-hero{text-align:center;margin-bottom:8px;}
.result-eyebrow{font-size:10.8px;font-weight:700;letter-spacing:1.8px;color:var(--accent-deep);text-transform:uppercase;}
.result-title{font-family:var(--font-display);font-size:30px;font-weight:600;color:var(--ink);margin:10px 0 6px;}
.result-client{font-size:13px;color:var(--muted);}
.result-total-card{
  background:radial-gradient(120% 140% at 15% 0%, #2A2618 0%, var(--dark) 45%, var(--dark-2) 100%);
  color:#fff;border-radius:18px;padding:38px 24px;text-align:center;margin:28px 0;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
}
.result-total-card::before{
  content:'';position:absolute;top:-40%;right:-20%;width:70%;height:140%;
  background:radial-gradient(closest-side, rgba(179,135,60,.28), transparent 70%);
  pointer-events:none;
}
.result-total-inner{position:relative;z-index:1;}
.result-total-label{font-size:10.3px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:12px;}
.result-total-value{font-family:var(--font-display);font-size:42px;font-weight:600;color:var(--gold);letter-spacing:.2px;font-variant-numeric:tabular-nums;}
.result-total-sub{font-size:11.5px;color:rgba(255,255,255,.55);margin-top:12px;}

.result-section-label{font-size:10.8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin:30px 0 13px;}
.result-cards{display:flex;flex-direction:column;gap:12px;}
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease;}
.result-card.in{opacity:1;transform:translateY(0);}
.result-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.result-card-name{font-size:13.5px;font-weight:700;color:var(--ink);}
.result-card-value{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--accent-deep);white-space:nowrap;font-variant-numeric:tabular-nums;}
.result-card-items{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.8;}
.result-min-badge{display:inline-block;background:var(--gold-soft);color:#7A5A22;font-size:9.3px;font-weight:800;padding:2px 9px;border-radius:20px;margin-top:9px;}
.result-min-badge[hidden]{display:none;}
.result-min-details{margin-top:11px;}
.result-min-details summary{font-size:10.2px;color:var(--muted);cursor:pointer;list-style:none;}
.result-min-details summary::-webkit-details-marker{display:none;}
.result-min-details summary:before{content:'⚙ ';}
.result-min-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.3px;font-weight:700;color:var(--ink-soft);gap:10px;}
.result-min-row input{width:74px;border:none;border-bottom:1.4px dashed var(--line-soft);background:transparent;text-align:right;font-family:var(--font-body);font-size:11.3px;font-weight:700;color:var(--ink);}
.result-min-reset{background:none;border:none;color:var(--accent-deep);font-size:10px;font-weight:800;cursor:pointer;}

.result-adic-list{font-size:11.5px;color:var(--ink-soft);line-height:2;}
.result-adic-list b{color:var(--ink);font-variant-numeric:tabular-nums;}

.result-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:32px;}
.result-fineprint{text-align:center;font-size:10.3px;color:var(--muted);margin-top:20px;line-height:1.6;}

/* ---------- MODAL (planos) ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(23,21,15,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal-box{background:var(--surface);border-radius:16px;max-width:840px;width:100%;max-height:85vh;overflow-y:auto;padding:30px;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--line-soft);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink-soft);}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink);margin:0 0 20px;}
.plans-wrap{display:flex;gap:14px;flex-wrap:wrap;}
.plan-card{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 6px rgba(23,21,15,.06);display:flex;flex-direction:column;border-radius:10px;overflow:hidden;}
.plan-head{padding:13px 10px;text-align:center;color:#fff;}
.plan-head .pname{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.3px;}
.plan-head .psub{font-size:9.3px;opacity:.85;margin-top:3px;}
.plan-standard .plan-head{background:var(--gold);}
.plan-pro .plan-head{background:var(--accent-deep);}
.plan-premium .plan-head{background:var(--ink);}
.plan-body{padding:14px 15px;font-size:11.5px;line-height:1.55;color:var(--ink-soft);}
.plan-body ul{margin:0;padding-left:16px;}
.plan-body li{margin-bottom:3px;}
.plan-add{margin-top:9px;font-size:10.5px;color:var(--muted);}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;font-weight:700;
  box-shadow:0 6px 20px rgba(23,21,15,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media print{
  .no-print{display:none !important;}
  .wizard-nav{display:none !important;}
  body{padding-bottom:0;background:#fff;}
  .wizard-top{background:#fff;color:var(--ink);}
  .wordmark-name,.wordmark-name em{color:var(--ink) !important;}
  .step-panel{opacity:1 !important;transform:none !important;}
  .result-card{opacity:1 !important;transform:none !important;}
}
@media (max-width:600px){
  .wizard-nav-inner{flex-wrap:wrap;}
  .nav-btns{width:100%;justify-content:stretch;}
  .nav-btns .btn{flex:1;}
  .result-actions .btn{flex:1;}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="wizard-shell">
  <div class="wizard-top">
    <div class="wizard-top-inner">
      <a class="back-link no-print" href="Selecionar_Proposta_Atlas.html">← Voltar para propostas</a>
      <div class="wordmark">
        <div class="wordmark-name">ATLAS<em>GR</em></div>
        <div class="wordmark-sub">Calculadora de Precificação</div>
      </div>
    </div>
    <div class="progress-track no-print"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-steps no-print" id="progressSteps"></div>
  </div>

  <div class="wizard-stage" id="wizardStage"></div>
</div>

<div class="wizard-nav no-print" id="wizardNav">
  <div class="wizard-nav-inner">
    <div class="nav-running-total">Total até agora<b id="navRunningTotal">R$ 0,00</b></div>
    <div class="nav-btns">
      <button type="button" class="btn btn-ghost" id="navBack">Voltar</button>
      <button type="button" class="btn btn-primary" id="navNext">Continuar</button>
    </div>
  </div>
</div>

<div class="modal-overlay no-print" id="plansModal">
  <div class="modal-box">
    <button type="button" class="modal-close" id="plansModalClose">✕</button>
    <div class="modal-title">Planos de atendimento — referência</div>
    <div class="plans-wrap" id="plansWrap"></div>
  </div>
</div>

<div class="toast no-print" id="toast"></div>

<script>
/* ================= DADOS BASE (valores-padrão das propostas Atlas GR) ================= */
var PLANOS = [
  {id:'standard', nome:'STANDARD', itens:['Personalização de até 2 operações','Acesso até 20 usuários','Telas Panorâmica e Mapa Gerencial','Macros Padrão Atlas','Notificação de alertas via WhatsApp','Treinamento online (1 por ano)','P.P.A (Procedimento Padrão Atlas)','Monitoramento com SM','Relatórios completos','Integração de SM']},
  {id:'pro', nome:'PRO', itens:['Personalização de até 5 operações','Acesso ilimitado de usuários','Telas Panorâmica e Mapa Gerencial','Macros personalizadas','Notificações de alerta via WhatsApp e e-mail','Treinamento online (3 por ano)','Atendimento de pós-venda','Atlas Analytics Padrão','Relatórios completos','Integração de SM']},
  {id:'premium', nome:'PREMIUM', itens:['Tudo do plano PRO','Treinamento de motoristas e ECVC','Monitoramento sem SM','Rastreamento sem SM (desengate e Jammer)','Visita de pós-venda','Atlas Analytics Personalizado','Plano de viagem para motoristas']}
];

var PRODUCTS = [
  {
    id:'gr', nome:'Gerenciamento de Risco (GR)', icon:'shield',
    desc:'Monitoramento de veículos e gestão de riscos 24 horas por 7 dias da semana.',
    fleetFields:{veiculos:['gr_veiculo','gr_rotograma'], viagens:['gr_viagem']},
    items:[
      {id:'gr_veiculo', label:'Monitoramento — por veículo/mês', unidade:'veículo(s)/mês', valor:120.00},
      {id:'gr_viagem', label:'Operação de terceiros — por viagem', unidade:'viagem(ns)/mês', valor:40.00},
      {id:'gr_checklist', label:'Checklist de sensores/atuadores — por demanda', unidade:'demanda(s)/mês', valor:5.90},
      {id:'gr_rotograma', label:'Envio de rotograma ao motorista', unidade:'veículo(s)/mês', valor:3.90}
    ]
  },
  {
    id:'profile', nome:'Atlas PROFILE — Perfil Securitário', icon:'idcard',
    desc:'Cadastro, consulta e análise de perfil de motoristas, autônomos e demais profissionais.',
    fleetFields:null,
    items:[
      {id:'profile_objeto', label:'Por objeto pesquisado (frota e agregados)', unidade:'objeto(s)', valor:23.90},
      {id:'profile_integrada', label:'Por pesquisa integrada (autônomos)', unidade:'pesquisa(s)', valor:31.90},
      {id:'profile_cpf_rh', label:'Por CPF pesquisado (linha RH)', unidade:'CPF(s)', valor:23.90},
      {id:'profile_cnh', label:'Por CNH pesquisada', unidade:'CNH(s)', valor:9.90},
      {id:'profile_consulta', label:'Por consulta (genérica)', unidade:'consulta(s)', valor:4.90},
      {id:'profile_erro', label:'Por erro de parâmetro', unidade:'ocorrência(s)', valor:4.90},
      {id:'profile_rdo', label:'Pesquisa avançada/RDO (combo 6 estados)', unidade:'pesquisa(s)', valor:4.90},

/* ================= ESTADO ================= */
var STATE = {
  cliente:{nome:'', cnpj:'', vendedor:''},
  produtos:[],
  respostas:{},       // itemId -> {incluido, qtd, valor}
  adicionais:{},      // adicId -> {incluido, qtd, valor}
  minTouched:{},      // productId -> bool
  minValues:{},       // productId -> number
  stepIndex:0,
  maxVisited:0
};

/* ================= HELPERS ================= */
function el(sel, root){ return (root||document).querySelector(sel); }
function els(sel, root){ return (root||document).querySelectorAll(sel); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function parseBR(v){
  if(!v) return 0;
  v = String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',', '.');
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function parseQtd(v){
  var n = parseInt(String(v||'').replace(/[^0-9]/g,''), 10);
  return isNaN(n) ? 0 : n;
}
function formatBR(n){
  return (n||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function findItemById(id){
  for(var i=0;i<PRODUCTS.length;i++){
    var p = PRODUCTS[i];
    for(var j=0;j<p.items.length;j++){ if(p.items[j].id===id) return p.items[j]; }
  }
  return null;
}
function findAdicById(id){
  for(var i=0;i<ADICIONAIS.length;i++){ if(ADICIONAIS[i].id===id) return ADICIONAIS[i]; }
  return null;
}
function getItemResp(item){
  if(!STATE.respostas[item.id]) STATE.respostas[item.id] = {incluido:false, qtd:0, valor:item.valor};
  return STATE.respostas[item.id];
}
function getAdicResp(a){
  if(!STATE.adicionais[a.id]) STATE.adicionais[a.id] = {incluido:false, qtd:a.qtdFixa?1:0, valor:a.valor};
  return STATE.adicionais[a.id];
}

/* ================= CÁLCULO (fonte única de verdade) ================= */
function computeTotals(){
  var porProduto = [];
  var totalRecorrente = 0;
  PRODUCTS.forEach(function(p){
    if(STATE.produtos.indexOf(p.id) === -1) return;
    var subtotal = 0;
    var itemsOut = [];
    p.items.forEach(function(item){
      var r = getItemResp(item);
      if(r.incluido && r.qtd > 0){
        var lt = r.valor * r.qtd;
        subtotal += lt;
        itemsOut.push({label:item.label, qtd:r.qtd, valor:r.valor, lt:lt, unidade:item.unidade});
      }
    });
    var autoMin = subtotal * MIN_PERCENT;
    if(!STATE.minTouched[p.id]) STATE.minValues[p.id] = autoMin;
    var minimo = STATE.minValues[p.id] || 0;
    var minApplied = minimo > 0 && subtotal > 0 && subtotal < minimo;
    var total = subtotal > 0 ? Math.max(subtotal, minimo) : 0;
    totalRecorrente += total;
    porProduto.push({id:p.id, nome:p.nome, subtotal:subtotal, minimo:minimo, minApplied:minApplied, total:total, items:itemsOut, minAuto:!STATE.minTouched[p.id]});
  });

  var adicionaisOut = [];
  var totalPontual = 0;
  ADICIONAIS.forEach(function(a){
    var r = getAdicResp(a);
    if(!r.incluido) return;
    var qtd = a.qtdFixa ? 1 : (r.qtd || 0);
    var valor = (r.valor != null) ? r.valor : a.valor;
    var lt = a.qtdFixa ? valor : valor * qtd;
    if(lt <= 0) return;
    if(a.tipo === 'recorrente'){ totalRecorrente += lt; } else { totalPontual += lt; }
    adicionaisOut.push({label:a.label, valor:valor, qtd:qtd, lt:lt, tipo:a.tipo, qtdFixa:!!a.qtdFixa});
  });

  return {porProduto:porProduto, adicionais:adicionaisOut, totalRecorrente:totalRecorrente, totalPontual:totalPontual};
}

/* ================= NAVEGAÇÃO ================= */
function getSteps(){
  var steps = ['intro','produtos'];
  STATE.produtos.forEach(function(id){ steps.push('produto:'+id); });
  steps.push('adicionais');
  steps.push('resultado');
  return steps;
}
function goNext(){
  var steps = getSteps();
  var key = steps[STATE.stepIndex];
  if(key === 'produtos' && STATE.produtos.length === 0){
    showToast('Selecione ao menos um produto para continuar.');
    return;
  }
  STATE.stepIndex = Math.min(steps.length - 1, STATE.stepIndex + 1);
  if(STATE.stepIndex > STATE.maxVisited) STATE.maxVisited = STATE.stepIndex;
  showStep();
}
function goBack(){
  STATE.stepIndex = Math.max(0, STATE.stepIndex - 1);
  showStep();
}
function goToIndex(i){
  if(i > STATE.maxVisited) return;
  STATE.stepIndex = i;
  showStep();
}

function showStep(){
  var steps = getSteps();
  if(STATE.stepIndex >= steps.length) STATE.stepIndex = steps.length - 1;
  var key = steps[STATE.stepIndex];
  var stage = el('#wizardStage');
  stage.innerHTML = renderStepHtml(key);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var panel = stage.querySelector('.step-panel');
      if(panel) panel.classList.add('in');
    });
  });
  updateProgress(steps);
  updateNav(steps, key);
  window.scrollTo(0,0);
  if(key === 'resultado') runResultAnimations();
}

function updateProgress(steps){
  var frac = steps.length > 1 ? STATE.stepIndex / (steps.length - 1) : 0;
  el('#progressFill').style.width = (frac*100) + '%';
  var dotsWrap = el('#progressSteps');
  dotsWrap.innerHTML = steps.map(function(s, i){
    var cls = 'progress-dot';
    if(i === STATE.stepIndex) cls += ' current';
    else if(i <= STATE.maxVisited) cls += ' done';
    return '<button type="button" class="'+cls+'" data-idx="'+i+'" aria-label="Etapa '+(i+1)+'"></button>';
  }).join('');
}

function updateNav(steps, key){
  var nav = el('#wizardNav');
  if(key === 'resultado' || key === 'intro'){ nav.style.display = 'none'; }
  else { nav.style.display = 'flex'; }
  el('#navBack').hidden = (STATE.stepIndex === 0);
  var nextLabel = 'Continuar';
  if(key === 'adicionais') nextLabel = 'Ver minha proposta →';
  el('#navNext').textContent = nextLabel;
  var totals = computeTotals();
  el('#navRunningTotal').textContent = 'R$ ' + formatBR(totals.totalRecorrente + totals.totalPontual);
}

  cards.forEach(function(card, i){
    setTimeout(function(){
      card.classList.add('in');
      var valEl = card.querySelector('[data-count-to]');
      if(valEl) animateCount(valEl, 700, 0);
    }, 260 + i*110);
  });
}
function animateCount(elm, duration, delay){
  if(!elm) return;
  var to = parseFloat(elm.dataset.countTo || '0');
  setTimeout(function(){
    var start = null;
    function step(ts){
      if(!start) start = ts;
      var p = Math.min((ts-start)/duration, 1);
      var eased = 1 - Math.pow(1-p, 3);
      elm.textContent = 'R$ ' + formatBR(to*eased);
      if(p < 1) requestAnimationFrame(step); else elm.textContent = 'R$ ' + formatBR(to);
    }
    requestAnimationFrame(step);
  }, delay);
}

/* ================= SINCRONIZAÇÃO DE DOM PONTUAL (sem re-render, preserva foco) ================= */
function syncItemCard(item){
  var card = el('[data-item-card="'+item.id+'"]');
  if(!card) return;
  var r = getItemResp(item);
  card.classList.toggle('active', !!r.incluido);
  var toggle = card.querySelector('.item-toggle'); if(toggle) toggle.checked = !!r.incluido;
  var qtyInput = card.querySelector('.item-qty-input');
  if(qtyInput && document.activeElement !== qtyInput) qtyInput.value = r.qtd || '';
  var ltEl = card.querySelector('.item-line-total');
  if(ltEl) ltEl.textContent = 'R$ ' + formatBR((r.qtd||0) * r.valor);
}
function syncAdicCard(a){
  var card = el('[data-item-card="adic:'+a.id+'"]');
  if(!card) return;
  var r = getAdicResp(a);
  card.classList.toggle('active', !!r.incluido);
  var toggle = card.querySelector('.adic-toggle'); if(toggle) toggle.checked = !!r.incluido;
  if(a.qtdFixa){
    var ltEl = card.querySelector('.item-line-total');
    if(ltEl) ltEl.textContent = 'R$ ' + formatBR(r.valor);
    return;
  }
  var qtyInput = card.querySelector('.adic-qty-input');
  if(qtyInput && document.activeElement !== qtyInput) qtyInput.value = r.qtd || '';
  var ltEl2 = card.querySelector('.item-line-total');
  if(ltEl2) ltEl2.textContent = 'R$ ' + formatBR((r.qtd||0) * r.valor);
}
function refreshFooterAndNav(){
  var t = computeTotals();
  var stage = el('#wizardStage');
  var panel = stage.querySelector('.step-panel');
  if(panel){
    var pid = panel.dataset.product;
    var liveEl = el('#liveSubtotal', stage);
    if(liveEl){
      if(panel.dataset.step === 'produto' && pid){
        var pd = t.porProduto.filter(function(x){return x.id===pid;})[0];
        liveEl.textContent = 'R$ ' + formatBR(pd ? pd.subtotal : 0);
      } else if(panel.dataset.step === 'adicionais'){
        liveEl.textContent = 'R$ ' + formatBR(t.adicionais.reduce(function(s,a){return s+a.lt;},0));
      }
    }
  }
  el('#navRunningTotal').textContent = 'R$ ' + formatBR(t.totalRecorrente + t.totalPontual);
}
function refreshResultTotals(){
  var t = computeTotals();
  var stage = el('#wizardStage');
  var hero = el('#resultHeroTotal', stage);
  if(hero){ hero.dataset.countTo = t.totalRecorrente; hero.textContent = 'R$ ' + formatBR(t.totalRecorrente); }
  t.porProduto.forEach(function(p){
    var card = stage.querySelector('[data-result-product="'+p.id+'"]');
    if(!card) return;
    var valEl = card.querySelector('.result-card-value');
    if(valEl){ valEl.dataset.countTo = p.total; valEl.textContent = 'R$ ' + formatBR(p.total); }
    var badge = card.querySelector('.result-min-badge');
    if(badge) badge.hidden = !p.minApplied;
    var modeEl = card.querySelector('.result-min-mode');
    if(modeEl) modeEl.textContent = p.minAuto ? '40% automático' : 'ajustado manualmente';
    var resetBtn = card.querySelector('.result-min-reset');
    if(resetBtn) resetBtn.hidden = p.minAuto;
    var minInput = card.querySelector('.result-min-input');
    if(minInput && document.activeElement !== minInput) minInput.value = formatBR(p.minimo);
  });
}

/* ================= FRETE RÁPIDO (quick-fill) ================= */
function applyQuickFill(productId, kind, rawValue){
  var qty = parseQtd(rawValue);
  var p = PRODUCTS.filter(function(x){return x.id===productId;})[0];
  if(!p || !p.fleetFields || !p.fleetFields[kind]) return;
  p.fleetFields[kind].forEach(function(itemId){
    var item = findItemById(itemId);
    if(!item) return;
    var r = getItemResp(item);
    r.qtd = qty;
    r.incluido = qty > 0;
    syncItemCard(item);
  });
  refreshFooterAndNav();
}

/* ================= TOAST ================= */
function showToast(msg){
  var t = el('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ================= COPIAR RESUMO ================= */
function copiarResumo(){
  var t = computeTotals();
  var nome = STATE.cliente.nome.trim() || '(cliente não informado)';
  var cnpj = STATE.cliente.cnpj.trim();
  var vendedor = STATE.cliente.vendedor.trim();
  var hoje = new Date().toLocaleDateString('pt-BR');

  var linhas = [];
  linhas.push('ORÇAMENTO — ATLAS GR');
  linhas.push('Cliente: ' + nome + (cnpj ? ' — CNPJ: ' + cnpj : ''));
  if(vendedor) linhas.push('Responsável comercial: ' + vendedor);
  linhas.push('Data: ' + hoje);
  linhas.push('');
  t.porProduto.forEach(function(p){
    if(p.total<=0) return;
    linhas.push(p.nome + ': R$ ' + formatBR(p.total) + (p.minApplied ? ' (mínimo mensal aplicado)' : ''));
    p.items.forEach(function(it){ linhas.push('  - ' + it.qtd + 'x ' + it.label + ': R$ ' + formatBR(it.lt)); });
  });
  if(t.adicionais.length){
    linhas.push('');
    linhas.push('Taxas e adicionais:');
    t.adicionais.forEach(function(a){
      linhas.push('  - ' + (a.qtdFixa?'':a.qtd+'x ') + a.label + ': R$ ' + formatBR(a.lt) + ' (' + (a.tipo==='recorrente'?'mensal':'pontual') + ')');
    });
  }
  linhas.push('');
  linhas.push('TOTAL MENSAL RECORRENTE: R$ ' + formatBR(t.totalRecorrente));
  linhas.push('TOTAL DE VALORES PONTUAIS: R$ ' + formatBR(t.totalPontual));
  linhas.push('');
  linhas.push('Valores de referência interna, sujeitos à validação da equipe comercial e às condições gerais do contrato Atlas GR.');

  var texto = linhas.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){
      showToast('Resumo copiado para a área de transferência.');
    }).catch(function(){ window.prompt('Copie o resumo abaixo:', texto); });
  } else {
    window.prompt('Copie o resumo abaixo:', texto);
  }
}

/* ================= MODAL PLANOS ================= */
function renderPlanos(){
  el('#plansWrap').innerHTML = PLANOS.map(function(p){
    return '<div class="plan-card plan-'+p.id+'">' +
      '<div class="plan-head"><div class="pname">'+p.nome+'</div><div class="psub">Detalhamento do plano</div></div>' +
      '<div class="plan-body"><ul>'+p.itens.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>' +
      '<div class="plan-add"><b>Adicional:</b> regras conforme apólice.</div></div>' +
    '</div>';
  }).join('');
}
function openPlansModal(){ el('#plansModal').classList.add('open'); }
function closePlansModal(){ el('#plansModal').classList.remove('open'); }

/* ================= EVENTOS ================= */
document.addEventListener('DOMContentLoaded', function(){
  renderPlanos();

  var params = new URLSearchParams(window.location.search);
  if(params.get('nome')) STATE.cliente.nome = params.get('nome');
  if(params.get('cnpj')) STATE.cliente.cnpj = params.get('cnpj');

  showStep();

  el('#navBack').addEventListener('click', goBack);
  el('#navNext').addEventListener('click', goNext);
  el('#plansModalClose').addEventListener('click', closePlansModal);
  el('#plansModal').addEventListener('click', function(e){ if(e.target.id === 'plansModal') closePlansModal(); });
  el('#progressSteps').addEventListener('click', function(e){
    var dot = e.target.closest('.progress-dot');
    if(dot) goToIndex(parseInt(dot.dataset.idx, 10));
  });

  var stage = el('#wizardStage');

  stage.addEventListener('input', function(e){
    var t = e.target;
    if(t.id === 'cliNome'){ STATE.cliente.nome = t.value; return; }
    if(t.id === 'cliCnpj'){ STATE.cliente.cnpj = t.value; return; }
    if(t.id === 'cliVendedor'){ STATE.cliente.vendedor = t.value; return; }

    if(t.classList.contains('quick-input')){
      applyQuickFill(t.dataset.product, t.dataset.kind, t.value);
      return;
    }
    if(t.classList.contains('item-qty-input')){
      var item = findItemById(t.dataset.item);
      var r = getItemResp(item);
      r.qtd = parseQtd(t.value);
      if(r.qtd > 0) r.incluido = true;
      var card = t.closest('.item-card');
      if(card){
        card.classList.toggle('active', r.incluido);
        var tog = card.querySelector('.item-toggle'); if(tog) tog.checked = r.incluido;
        var ltEl = card.querySelector('.item-line-total'); if(ltEl) ltEl.textContent = 'R$ ' + formatBR(r.qtd * r.valor);
      }
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('item-valor-input')){
      var item2 = findItemById(t.dataset.item);
      var r2 = getItemResp(item2);
      r2.valor = parseBR(t.value);
      var card2 = t.closest('.item-card');
      if(card2){ var ltEl2 = card2.querySelector('.item-line-total'); if(ltEl2) ltEl2.textContent = 'R$ ' + formatBR(r2.qtd * r2.valor); }
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('adic-qty-input')){
      var a = findAdicById(t.dataset.adic);
      var ra = getAdicResp(a);
      ra.qtd = parseQtd(t.value);
      if(ra.qtd > 0) ra.incluido = true;
      var cardA = t.closest('.item-card');
      if(cardA){
        cardA.classList.toggle('active', ra.incluido);
        var togA = cardA.querySelector('.adic-toggle'); if(togA) togA.checked = ra.incluido;
        var ltA = cardA.querySelector('.item-line-total'); if(ltA) ltA.textContent = 'R$ ' + formatBR(ra.qtd * ra.valor);
      }
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('adic-valor-input')){
      var a2 = findAdicById(t.dataset.adic);
      var ra2 = getAdicResp(a2);
      ra2.valor = parseBR(t.value);
      var cardA2 = t.closest('.item-card');
      if(cardA2){ var ltA2 = cardA2.querySelector('.item-line-total'); if(ltA2) ltA2.textContent = 'R$ ' + formatBR(ra2.qtd * ra2.valor); }
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('adic-lump-input')){
      var a3 = findAdicById(t.dataset.adic);
      var ra3 = getAdicResp(a3);
      ra3.valor = parseBR(t.value);
      if(ra3.valor > 0) ra3.incluido = true;
      var cardA3 = t.closest('.item-card');
      if(cardA3){
        cardA3.classList.toggle('active', ra3.incluido);
        var togA3 = cardA3.querySelector('.adic-toggle'); if(togA3) togA3.checked = ra3.incluido;
        var ltA3 = cardA3.querySelector('.item-line-total'); if(ltA3) ltA3.textContent = 'R$ ' + formatBR(ra3.valor);
      }
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('result-min-input')){
      STATE.minTouched[t.dataset.product] = true;
      STATE.minValues[t.dataset.product] = parseBR(t.value);
      refreshResultTotals();
      return;
    }
  });

  stage.addEventListener('change', function(e){
    var t = e.target;
    if(t.classList.contains('item-toggle')){
      var item = findItemById(t.dataset.item);
      var r = getItemResp(item);
      r.incluido = t.checked;
      if(r.incluido && !r.qtd) r.qtd = 1;
      syncItemCard(item);
      refreshFooterAndNav();
      return;
    }
    if(t.classList.contains('adic-toggle')){
      var a = findAdicById(t.dataset.adic);
      var r2 = getAdicResp(a);
      r2.incluido = t.checked;
      if(r2.incluido && !a.qtdFixa && !r2.qtd) r2.qtd = 1;
      syncAdicCard(a);
      refreshFooterAndNav();
      return;
    }
  });

  stage.addEventListener('click', function(e){
    var chip = e.target.closest('.chip-card');
    if(chip){
      var pid = chip.dataset.product;
      var idx = STATE.produtos.indexOf(pid);
      if(idx === -1) STATE.produtos.push(pid); else STATE.produtos.splice(idx, 1);
      chip.classList.toggle('active');
      var check = chip.querySelector('.chip-check');
      return;
    }
    if(e.target.id === 'btnVerPlanos'){ openPlansModal(); return; }
    if(e.target.id === 'btnIntroContinuar'){ goNext(); return; }
    if(e.target.classList.contains('result-min-reset')){
      STATE.minTouched[e.target.dataset.product] = false;
      refreshResultTotals();
      return;
    }
    if(e.target.id === 'btnCopiarResumo'){ copiarResumo(); return; }
    if(e.target.id === 'btnImprimir'){ window.print(); return; }
    if(e.target.id === 'btnEditarRespostas'){ goToIndex(1); return; }
    if(e.target.id === 'btnNovaSimulacao'){
      if(window.confirm('Isso vai limpar tudo e recomeçar. Deseja continuar?')) window.location.reload();
      return;
    }
  });
});
</script>
